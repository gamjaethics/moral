<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>북한에서의 하루 | 미션 아케이드</title><style>
:root{font-family:system-ui,'Noto Sans KR',sans-serif;color:#21334b;background:#edf2fa}*{box-sizing:border-box}body{margin:0;padding:14px}.app{max-width:800px;margin:auto}.top{background:#193d73;color:white;border-radius:20px;padding:20px;box-shadow:0 8px 25px #173e7130}.top h1{margin:5px 0;font-size:26px}.sub{opacity:.84;font-size:13px}.stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.stat{background:#ffffff24;border:1px solid #ffffff30;border-radius:20px;padding:7px 12px;font-weight:700;font-size:13px}.progress{height:9px;border-radius:9px;background:#ffffff36;margin-top:13px;overflow:hidden}.bar{height:100%;background:#ffcf65;transition:width .3s}.panel{background:white;border-radius:20px;padding:22px;margin-top:14px;box-shadow:0 5px 20px #193d7310}.scene{background:linear-gradient(155deg,#d8e9f7,#f8e5d1);border-radius:18px;padding:20px;min-height:150px;position:relative;overflow:hidden}.scene .big{font-size:54px;letter-spacing:6px;text-align:center;margin:12px 0}.scene p{margin:6px 0;text-align:center;color:#38526a}.mission{background:#f1f6ff;border-left:5px solid #447fca;padding:13px;border-radius:10px;margin:15px 0;line-height:1.65}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:9px}.tile{border:2px solid #d2deec;background:#fff;border-radius:13px;padding:14px 10px;font-size:15px;color:#263d57;cursor:pointer;min-height:65px;font-weight:650;touch-action:manipulation}.tile:active{transform:scale(.98)}.tile.selected{border-color:#2379c4;background:#e0f0ff}.tile.good{border-color:#3f9b70;background:#e2f7e9}.tile.bad{border-color:#ce6a66;background:#fff0ee}.btn{background:#245eb2;border:0;color:white;border-radius:12px;padding:13px 20px;font-size:16px;font-weight:700;cursor:pointer}.btn:disabled{opacity:.4;cursor:default}.btn.secondary{background:#e8effa;color:#244b82}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.note{font-size:14px;line-height:1.8;color:#4a6078}.feedback{background:#eaf6ed;border-radius:12px;padding:12px;margin:12px 0;line-height:1.7}.warning{background:#fff5e6;border-radius:12px;padding:12px;line-height:1.7}.meter{font-weight:800;font-size:19px;margin:10px 0}.cards{display:flex;flex-wrap:wrap;gap:9px}.cards .tile{flex:1 1 120px}.scene .label{position:absolute;top:10px;left:12px;font-size:12px;background:#ffffffba;border-radius:30px;padding:5px 10px}.small{font-size:12px;color:#6b7c90}.hidden{display:none}.drop{min-height:64px;border:2px dashed #8ba8ca;border-radius:12px;background:#f4f8ff;padding:10px;margin:8px 0}.active{border-color:#236dc5;background:#e5f1ff}footer{text-align:center;color:#718197;font-size:12px;margin:20px}.em{font-size:23px}h2{margin:0 0 12px;font-size:22px}h3{margin:16px 0 8px;font-size:17px}button:focus-visible{outline:3px solid #ffbd55;outline-offset:2px}@media(max-width:500px){.panel{padding:16px}.scene{min-height:125px}.scene .big{font-size:42px}}
</style></head><body><main class="app"><header class="top"><div class="sub">중학교 도덕 · 개인별 미션 게임 · 오프라인 실행 가능</div><h1>🎮 북한에서의 하루: 미션 아케이드</h1><div class="stats"><span class="stat" id="stage">미션 0/6</span><span class="stat" id="score">⭐ 0점</span><span class="stat" id="stars">🏅 배지 0개</span></div><div class="progress"><div class="bar" id="bar"></div></div></header><section class="panel" id="game"></section><footer>교육용 가상 상황입니다. 북한의 실제 생활은 시기·지역·가정에 따라 다를 수 있습니다.<br>참고 자료 검증: 국립통일교육원 『북한 이해』의 관련 장을 교사가 대조하여 최종 활용하세요.</footer></main><script>
const $=id=>document.getElementById(id);let level=-1,score=0,badges=0,tries=0,done=false,selected=[],phase=0,items=[],balance=10,seq=0,steps=[],matched=[],timer=null,seconds=0;
const scenes=[['🚶','집단등교 대열 맞추기','친구들과 모여 학교로 향하는 가상 장면이에요. 순서대로 친구들을 눌러 대열을 완성하세요.'],['🏫','교실 탐정','교실의 물건을 관찰하고 그 의미를 올바르게 연결하세요.'],['🤸','업간체조 기억력 게임','화면에 나온 동작 순서를 기억해 따라 눌러 보세요.'],['🚩','조선소년단 활동 카드','조선소년단의 활동 사례를 읽고 어떤 성격의 활동인지 분류하세요.'],['🛒','장마당 장보기','주어진 예산 안에서 가족에게 필요한 물건을 골라 보세요.'],['📓','생활총화와 정치 탐구','생활총화와 선거 제도에 관한 자료를 읽고 핵심 정보를 찾아 보세요.']];
function head(){ $('stage').textContent=`미션 ${Math.max(0,level+1)}/6`;$('score').textContent=`⭐ ${score}점`;$('stars').textContent=`🏅 배지 ${badges}개`;$('bar').style.width=`${Math.max(0,(level+1)/6)*100}%`}
function button(t,fn,cls=''){return `<button class="tile ${cls}" onclick="${fn}">${t}</button>`}
function render(){head();if(level<0){$('game').innerHTML=`<div class="scene"><div class="label">START</div><div class="big">🏠 🌄 🏫</div><p>가상의 북한 청소년 '은별'의 하루</p></div><h2>6개의 미니게임에 도전!</h2><p>누르기만 하는 체험이 아니라 <b>순서 맞추기, 기억력, 연결, 분류, 장보기, 자료 해독</b> 미션을 해결합니다.</p><div class="mission">🎯 목표: 배지 6개 수집 · 최대 120점<br>⏱️ 권장 수업 시간: 15~20분 (교사의 설명·토론 포함)</div><p class="note">모든 장면은 학습용으로 재구성한 가상 상황입니다. 한 학생의 경험이 북한 전체의 모습은 아닙니다.</p><button class="btn" onclick="next()">게임 시작 ▶</button>`;return}
if(level>=6){$('game').innerHTML=`<div class="scene"><div class="big">🏆 🌟 🎉</div><p>오늘의 탐험을 마쳤어요!</p></div><h2>🎊 모든 미션 완료!</h2><div class="meter">최종 점수 ${score}점 · 획득 배지 ${badges}/6개</div><p>집단등교부터 학교생활과 장마당까지, 북한의 하루를 탐험했어요.</p><div class="feedback">✨ 수고했어요! 게임에서 만난 장면들은 북한 사회의 여러 모습을 알아보기 위한 학습용 사례예요.</div><div class="buttons"><button class="btn" onclick="restart()">🔄 처음부터 다시 플레이</button></div>`;return}
let s=scenes[level];$('game').innerHTML=`<div class="scene"><div class="label">MISSION ${level+1}</div><div class="big">${s[0]} ${['👫','🖼️','🙆','🧣','🥬','🗳️'][level]}</div><p>${s[1]}</p></div><h2 style="margin-top:16px">${s[1]}</h2><div class="mission">${s[2]}</div><div id="task"></div><div id="result"></div>`;[school,room,exercise,pioneer,market,civic][level]()}
function next(){level++;tries=0;done=false;selected=[];phase=0;items=[];balance=10;seq=0;steps=[];matched=[];render()}
function reward(msg){if(done)return;done=true;badges++;score+=Math.max(10,20-tries*2);head();$('result').innerHTML=`<div class="feedback"><b>🏅 미션 완료!</b><br>${msg}</div><button class="btn" onclick="next()">${level===5?'최종 결과 보기':'다음 미션 ▶'}</button>`}
function wrong(msg){tries++;$('result').innerHTML=`<div class="warning">💡 ${msg}</div>`}
function school(){let order=['모임 장소 확인','친구들과 모이기','대열 맞춰 이동'];$('task').innerHTML=`<h3>🚶 집단등교 순서 퍼즐</h3><p>카드를 올바른 순서로 눌러 보세요. (틀리면 다시 시작)</p><div class="grid">${[2,0,1].map(i=>button(['① 📍 모임 장소 확인','② 👋 친구들과 모이기','③ 🚶 대열 맞춰 이동'][i],`schoolPick(${i})`)).join('')}</div><p class="meter" id="order">진행: 0/3</p><p class="note">이 장면은 집단등교가 이루어지는 학교를 가정했습니다. 모든 북한 학생의 등교 방식이 동일하다고 단정하지 않습니다.</p>`;}
function schoolPick(i){if(done)return;if(i!==seq){seq=0;wrong('먼저 모일 장소를 확인해야 해요. 처음부터 다시 해 보세요.')}else{seq++;$('result').innerHTML='';$('order').textContent=`진행: ${seq}/3`;if(seq===3)reward('정해진 시간과 장소에 모여 함께 이동하는 집단생활의 모습을 살펴보았어요.')}}
const objects=[['🖼️ 교실의 지도자 초상화','정치 지도자에 대한 교육'],['📘 교과서','교과 학습과 사상교육'],['🪑 책상과 의자','수업을 위한 공간']];
function room(){$('task').innerHTML=`<h3>🔎 의미 연결 게임</h3><p>왼쪽 물건을 선택하고, 그 의미를 오른쪽에서 골라 연결하세요.</p><div class="grid"><div>${objects.map((o,i)=>button(o[0],`roomLeft(${i})`,'left'+i)).join('')}</div><div>${[2,0,1].map(i=>button(objects[i][1],`roomRight(${i})`,'right'+i)).join('')}</div></div><p id="matches" class="meter">연결 0/3</p>`}
let chosen=-1;function roomLeft(i){if(done||matched.includes(i))return;chosen=i;document.querySelectorAll('.tile').forEach(x=>x.classList.remove('selected'));document.querySelector('.left'+i).classList.add('selected')}
function roomRight(i){if(done)return;if(chosen<0){wrong('먼저 왼쪽에서 물건을 골라 주세요.');return}if(chosen!==i){wrong('물건의 역할을 다시 생각해 보세요.');return}matched.push(i);document.querySelector('.left'+i).classList.add('good');document.querySelector('.right'+i).classList.add('good');document.querySelector('.left'+i).disabled=true;document.querySelector('.right'+i).disabled=true;chosen=-1;$('result').innerHTML='';$('matches').textContent=`연결 ${matched.length}/3`;if(matched.length===3)reward('북한 학교의 교실 물건에는 일반적인 학습 도구뿐 아니라 정치사상 교육과 관련된 요소도 있어요.')}
const motions=['🙆 팔 올리기','↔️ 양팔 벌리기','🙇 몸 숙이기'];let pattern=[0,2,1,0];
function exercise(){$('task').innerHTML=`<h3>🧠 업간체조 동작 기억하기</h3><p>먼저 4개의 동작을 5초 동안 보고 외우세요.</p><div id="memory" class="mission" style="text-align:center;font-size:20px">${pattern.map(i=>motions[i]).join(' → ')}</div><div id="motionBtns" class="grid hidden">${motions.map((m,i)=>button(m,`motionPick(${i})`)).join('')}</div><p id="motionCount" class="meter"></p><button id="memorize" class="btn" onclick="startMemory()">5초 암기 시작</button><p class="note">업간체조는 수업 중간에 몸을 움직이는 활동을 가리킵니다. 게임의 동작 순서는 실제 표준 체조 순서를 재현한 것이 아닙니다.</p>`}
function startMemory(){if(phase)return;phase=1;$('memorize').disabled=true;let n=5;$('motionCount').textContent=`${n}초 후 시작`;timer=setInterval(()=>{n--;$('motionCount').textContent=`${n}초 후 시작`;if(n<=0){clearInterval(timer);$('memory').textContent='❓ 기억한 순서대로 누르세요';$('motionBtns').classList.remove('hidden');$('motionCount').textContent='성공 0/4';}},1000)}
function motionPick(i){if(done||!phase)return;if(i!==pattern[seq]){seq=0;wrong('순서가 달라요! 첫 번째 동작부터 다시 시도하세요.')}else{seq++;$('result').innerHTML='';$('motionCount').textContent=`성공 ${seq}/4`;if(seq===4)reward('동작 기억 미션 성공! 집단 체조 활동을 게임으로 체험했어요.')}}
const acts=[['정해진 모임에서 단체 활동하기','조직생활'],['정치 관련 구호와 학습 내용 익히기','정치사상 교육'],['친구들과 함께 봉사 활동하기','집단 활동']];
function pioneer(){$('task').innerHTML=`<h3>🚩 조선소년단 활동 분류</h3><p>활동 카드를 보고 성격이 가장 가까운 항목을 골라 주세요.</p><div class="mission" id="activity"></div><div class="grid">${['조직생활','정치사상 교육','집단 활동'].map((x,i)=>button(x,`pioneerPick(${i})`)).join('')}</div><p id="pioneerCount" class="meter">0/3</p><p class="note">조선소년단은 북한의 아동·소년 조직으로, 학교생활과 연계된 집단 활동 및 정치사상 교육이 이루어집니다. 여기의 활동은 학습용 예시입니다.</p>`;showAct()}
function showAct(){$('activity').textContent=acts[seq][0]}
function pioneerPick(i){if(done)return;let right=[0,1,2][seq];if(i!==right){wrong('활동의 중심이 조직 규율인지, 정치 학습인지, 함께하는 활동인지 살펴보세요.');return}seq++;$('result').innerHTML='';$('pioneerCount').textContent=`${seq}/3`;if(seq===3)reward('조선소년단은 단순한 취미 동아리와 달리 조직생활과 정치사상 교육의 성격도 갖고 있어요.');else showAct()}
const goods=[['🥔 감자',3],['🥬 채소',2],['🍎 과일',4],['📒 공책',3],['🧼 비누',2],['🎈 장난감',5]];
function market(){$('task').innerHTML=`<h3>🛒 장마당 장보기</h3><p>가상의 예산 <b>10토큰</b>으로 <b>식품 1개, 학용품 1개, 생활용품 1개</b>를 골라 보세요. 토큰은 실제 북한 화폐가 아닙니다.</p><div class="grid">${goods.map((g,i)=>button(`${g[0]}<br>${g[1]}토큰`,`buy(${i})`,'good'+i)).join('')}</div><div class="meter" id="budget">남은 돈 10토큰</div><div id="basket" class="mission">장바구니가 비어 있어요.</div><div class="buttons"><button class="btn secondary" onclick="resetMarket()">장바구니 비우기</button><button class="btn" onclick="checkMarket()">장보기 완료</button></div><p class="note">장마당은 북한에서 상품이 거래되는 시장입니다. 실제 가격·구매 가능 품목은 지역과 시기에 따라 다릅니다.</p>`}
function buy(i){if(done)return;if(items.includes(i)){wrong('이미 담은 물건입니다.');return}if(balance<goods[i][1]){wrong('예산이 부족해요. 장바구니를 다시 구성해 보세요.');return}items.push(i);balance-=goods[i][1];$('budget').textContent=`남은 돈 ${balance}토큰`;$('basket').textContent=items.map(x=>goods[x][0]).join(' · ');document.querySelector('.good'+i).classList.add('good');$('result').innerHTML=''}
function resetMarket(){items=[];balance=10;document.querySelectorAll('[class*=good]').forEach(e=>e.classList.remove('good'));$('budget').textContent='남은 돈 10토큰';$('basket').textContent='장바구니가 비어 있어요.';$('result').innerHTML=''}
function checkMarket(){let cats=[items.some(i=>i<3),items.includes(3),items.includes(4)];if(cats.every(Boolean))reward('필요한 물건을 예산에 맞춰 골랐어요. 시장은 물품을 사고파는 경제생활의 공간이에요.');else wrong('식품, 학용품(공책), 생활용품(비누)을 각각 하나 이상 담아야 해요.')}
const questions=[{doc:'생활총화는 조직 구성원이 일정 기간 자신의 생활과 활동을 돌아보고 비판·자기비판을 하는 활동이다.',q:'이 설명에서 생활총화의 핵심 활동은?',a:['상품 가격 흥정','자기비판과 상호비판','체육 경기'],right:1,why:'생활총화는 조직생활에서 자신의 행동을 돌아보고 서로 비판하는 활동과 관련이 있어요.'},{doc:'북한의 최고인민회의 대의원 선거는 일반적인 다당제 경쟁 선거와 후보 추천·선정 및 경쟁 구조에서 차이가 있다.',q:'자료를 통해 살펴볼 핵심 비교 기준은?',a:['후보 간 실질적 경쟁 여부','투표소 건물의 색깔','선거일의 날씨'],right:0,why:'선거를 비교할 때에는 후보 선택의 폭과 경쟁 구조 같은 제도적 특징을 살펴봐야 해요.'},{doc:'북한의 학교 교육에는 일반 교과 학습과 함께 정치사상 교육이 포함된다.',q:'학교생활을 이해할 때 함께 살펴봐야 할 내용은?',a:['교실 창문 개수','급식 그릇의 모양','교과 학습과 정치사상 교육'],right:2,why:'교과 학습과 정치사상 교육이 함께 이루어진다는 점을 이해하는 것이 중요해요.'}];
function civic(){$('task').innerHTML=`<h3>🗂️ 자료 해독 3연속</h3><p>짧은 자료를 읽고 핵심 정보만 골라 보세요. 마지막 미션은 시간 제한 없이 진행됩니다.</p><div class="mission" id="document"></div><h3 id="cq"></h3><div class="grid" id="answers"></div><p class="meter" id="cCount">0/3</p>`;showQ()}
function showQ(){let q=questions[seq];$('document').textContent='📄 자료: '+q.doc;$('cq').textContent=q.q;$('answers').innerHTML=q.a.map((a,i)=>button(a,`answer(${i})`)).join('')}
function answer(i){let q=questions[seq];if(i!==q.right){wrong('자료에서 답을 찾을 수 있어요. 다시 읽고 선택해 보세요.');return}seq++;$('result').innerHTML=`<div class="feedback">${q.why}</div>`;$('cCount').textContent=`${seq}/3`;if(seq===3)reward('자료의 핵심을 찾아냈어요! 북한의 정치와 학교생활을 이해할 때에는 제도와 실제 생활을 구분해서 살펴보세요.');else showQ()}
function restart(){level=-1;score=0;badges=0;matched=[];chosen=-1;render()}

render();
</script></body></html>
